name: exp-node-timing

on:
  push:
    branches:
      - ep/exp-node-timing

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
        copy:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/ci/package-tests.sh build macos-x86_64
      - working-directory: packages/simplex-chat-nodejs
        shell: bash
        run: |
          for i in 1 2 3 4 5
          do
            echo "ROUND $i $(date -u +%T)"
            npx jest tests/core.test.ts --verbose --forceExit || echo "ROUND $i FAILED"
          done
