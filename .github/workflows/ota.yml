name: ota

run-name: "${{ inputs.pr && format('ota pull request #{0}', inputs.pr) || 'ota' }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number; empty builds the branch the run starts on
        type: string
        default: ""
      android:
        description: Build the Android APKs
        type: boolean
        default: true
      ios:
        description: Build the iOS archive
        type: boolean
        default: true
      linux:
        description: Build the Linux AppImage
        type: boolean
        default: true
      macos:
        description: Build the macOS dmg
        type: boolean
        default: true
      windows:
        description: Build the Windows msi
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ota-${{ github.ref }}-${{ inputs.pr }}
  cancel-in-progress: true

env:
  GHC_VER: 9.6.3
  CABAL_VER: 3.10.2.0
  JAVA_VER: 17
  IOS_CORE_PKG: pkg-ios-aarch64-swift-json.zip

jobs:
  plan:
    name: choose the commit and jobs, find earlier builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      run-android: ${{ steps.jobs.outputs.android }}
      run-ios: ${{ steps.jobs.outputs.ios }}
      run-linux: ${{ steps.jobs.outputs.linux }}
      run-macos: ${{ steps.jobs.outputs.macos }}
      run-windows: ${{ steps.jobs.outputs.windows }}
      android-core: ${{ steps.names.outputs.android-core }}
      android-core-run: ${{ steps.android-core.outputs.run-id }}
      android-core-armv7a: ${{ steps.names.outputs.android-core-armv7a }}
      android-core-armv7a-run: ${{ steps.android-core-armv7a.outputs.run-id }}
      android-cores: ${{ steps.android-cores.outputs.build }}
      ios-core: ${{ steps.names.outputs.ios-core }}
      ios-core-run: ${{ steps.ios-core.outputs.run-id }}
      linux-core: ${{ steps.names.outputs.linux-core }}
      linux-core-run: ${{ steps.linux-core.outputs.run-id }}
      macos-core: ${{ steps.names.outputs.macos-core }}
      macos-core-run: ${{ steps.macos-core.outputs.run-id }}
      windows-core: ${{ steps.names.outputs.windows-core }}
      windows-core-run: ${{ steps.windows-core.outputs.run-id }}
    steps:
      - name: Choose jobs
        id: jobs
        env:
          PR: ${{ inputs.pr }}
          ANDROID: ${{ inputs.android }}
          IOS: ${{ inputs.ios }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr must be a pull request number, not '$PR'"
            exit 1
          fi
          echo "android=$ANDROID" | tee -a "$GITHUB_OUTPUT"
          echo "ios=$IOS" | tee -a "$GITHUB_OUTPUT"
          echo "linux=$LINUX" | tee -a "$GITHUB_OUTPUT"
          echo "macos=$MACOS" | tee -a "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.sha }}

      - name: Commit
        id: commit
        run: |
          if [ ! -f .github/workflows/ota.yml ]; then
            echo "::error::$(git rev-parse --short HEAD) predates this workflow: merge master into it"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='%h %an %s'

      - name: Artifact names
        id: names
        run: |
          android=${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'PRIVACY.md', 'flake.nix', 'flake.lock', 'scripts/nix/**', 'scripts/ci/android/build-core.sh') }}
          echo "android-core=android-core-$android" >> "$GITHUB_OUTPUT"
          echo "android-core-armv7a=android-core-armv7a-$android" >> "$GITHUB_OUTPUT"
          echo "ios-core=ios-sim-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'scripts/ci/ios-sim/build-core.sh') }}" >> "$GITHUB_OUTPUT"
          echo "linux-core=desktop-linux-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'PRIVACY.md', 'scripts/desktop/build-lib-linux.sh', 'scripts/ci/desktop-linux/build-core.sh') }}" >> "$GITHUB_OUTPUT"
          echo "macos-core=desktop-macos-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'PRIVACY.md', 'scripts/desktop/build-lib-mac.sh', 'scripts/ci/desktop-linux/build-core.sh') }}" >> "$GITHUB_OUTPUT"
          echo "windows-core=desktop-windows-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'PRIVACY.md', 'libsimplex.dll.def', 'scripts/desktop/build-lib-windows.sh', 'scripts/desktop/prepare-openssl-windows.sh', 'scripts/ci/desktop-linux/build-core.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Find Android core library
        id: android-core
        if: steps.jobs.outputs.android == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.android-core }}"

      - name: Find Android core library for armv7a
        id: android-core-armv7a
        if: steps.jobs.outputs.android == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.android-core-armv7a }}"

      - name: Android core libraries to build
        id: android-cores
        if: steps.jobs.outputs.android == 'true'
        env:
          ARM64: ${{ steps.names.outputs.android-core }}
          ARM64_RUN: ${{ steps.android-core.outputs.run-id }}
          ARMV7A: ${{ steps.names.outputs.android-core-armv7a }}
          ARMV7A_RUN: ${{ steps.android-core-armv7a.outputs.run-id }}
        run: |
          jq -nc --arg arm64 "$ARM64" --arg arm64_run "$ARM64_RUN" --arg armv7a "$ARMV7A" --arg armv7a_run "$ARMV7A_RUN" '
            [ {arch: "aarch64", abi: "arm64-v8a", artifact: $arm64, run: $arm64_run},
              {arch: "armv7a", abi: "armeabi-v7a", artifact: $armv7a, run: $armv7a_run} ]
            | map(select(.run == "") | del(.run))' | sed 's/^/build=/' | tee -a "$GITHUB_OUTPUT"

      - name: Find iOS core library
        id: ios-core
        if: steps.jobs.outputs.ios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.ios-core }}"

      - name: Find Linux core library
        id: linux-core
        if: steps.jobs.outputs.linux == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.linux-core }}"

      - name: Find macOS core library
        id: macos-core
        if: steps.jobs.outputs.macos == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.macos-core }}"

      - name: Find Windows core library
        id: windows-core
        if: steps.jobs.outputs.windows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/desktop-linux/earlier-run.sh "${{ steps.names.outputs.windows-core }}"

  android-core:
    name: core library for Android ${{ matrix.abi }}
    needs: plan
    if: needs.plan.outputs.run-android == 'true' && needs.plan.outputs.android-cores != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android-cores) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: tree:0

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /

      - name: Build core library
        run: scripts/ci/android/build-core.sh ~/core/android-core-${{ matrix.abi }}.tar.gz ${{ matrix.arch }}

      - name: Upload core library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ~/core/android-core-${{ matrix.abi }}.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android APKs
    needs: [plan, android-core]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.run-android == 'true' && needs.android-core.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk" || true

      - name: Download core library
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.android-core }}
          path: ~/core
          run-id: ${{ needs.plan.outputs.android-core-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download core library for armv7a
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.android-core-armv7a }}
          path: ~/core
          run-id: ${{ needs.plan.outputs.android-core-armv7a-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install core libraries
        run: |
          scripts/ci/android/install-core.sh ~/core/android-core-arm64-v8a.tar.gz arm64-v8a
          scripts/ci/android/install-core.sh ~/core/android-core-armeabi-v7a.tar.gz armeabi-v7a

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VER }}

      - name: Build APKs
        id: build
        working-directory: apps/multiplatform
        run: |
          version=$(sed -n 's/^android.version_name=//p' gradle.properties)-ota.$GITHUB_RUN_NUMBER
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          ./gradlew --no-daemon --console=plain --init-script ../../scripts/ci/android/dev-app.gradle \
            -Psimplex.assets.dir=../../assets -Pandroid.version_code="$GITHUB_RUN_NUMBER" -Pandroid.version_name="$version" \
            :android:assembleFossRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/build/outputs/apk/foss/release/*.apk "$RUNNER_TEMP/apk"
          ls -la "$RUNNER_TEMP/apk"

      - name: Check APKs
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          for abi in arm64-v8a armeabi-v7a; do
            apk=$RUNNER_TEMP/apk/android-foss-$abi-release-unsigned.apk
            badging=$("$aapt2" dump badging "$apk")
            echo "$badging" | grep -E "^(package|application-label|native-code):"
            unzip -l "$apk" | grep -E ' lib/'
            echo "$badging" | grep -qF "package: name='chat.simplex.app.dev' versionCode='$GITHUB_RUN_NUMBER' versionName='$VERSION'"
            echo "$badging" | grep -qx "application-label:'SimpleX dev'"
            echo "$badging" | grep -qx "native-code: '$abi'"
            "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'authorities.*="chat.simplex.app.dev.provider"'
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ota-android
          path: ${{ runner.temp }}/apk/*.apk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS archive
    needs: plan
    if: needs.plan.outputs.run-ios == 'true'
    runs-on: macos-26
    timeout-minutes: 240
    env:
      BUILD_CORE: ${{ needs.plan.outputs.ios-core-run == '' }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Show runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          xcodebuild -version
          xcrun --show-sdk-path
          ls /Library/Developer/CommandLineTools/SDKs || true

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Setup Haskell
        if: env.BUILD_CORE == 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        if: env.BUILD_CORE == 'true'
        run: brew install openssl@3 libffi gmp

      - name: Build core library
        if: env.BUILD_CORE == 'true'
        run: scripts/ci/ios-sim/build-core.sh ~/Downloads/${{ env.IOS_CORE_PKG }}

      - name: Upload core library
        if: env.BUILD_CORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.ios-core }}
          path: ~/Downloads/${{ env.IOS_CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download core library
        if: env.BUILD_CORE != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.ios-core }}
          path: ~/Downloads
          run-id: ${{ needs.plan.outputs.ios-core-run }}
          github-token: ${{ github.token }}

      - name: Prepare libraries
        run: |
          scripts/ci/ios-sim/prepare-libs.sh ios
          scripts/ios/update-pbxproj.sh

      - name: Archive app
        run: |
          build=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);/\1/p' apps/ios/SimpleX.xcodeproj/project.pbxproj | sort -u).$GITHUB_RUN_NUMBER
          echo "build $build"
          xcodebuild archive -quiet \
            -project apps/ios/SimpleX.xcodeproj \
            -scheme "SimpleX (iOS)" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SimpleX.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$build"

      - name: Check archive
        run: |
          archive=$RUNNER_TEMP/SimpleX.xcarchive
          app=$archive/Products/Applications/SimpleX.app
          ls "$archive" "$archive/dSYMs" "$app/PlugIns" "$app/Frameworks"
          plutil -extract ApplicationProperties xml1 -o - "$archive/Info.plist"
          for bundle in "$app/Frameworks/SimpleXChat.framework" "$app/PlugIns/SimpleX NSE.appex" "$app/PlugIns/SimpleX SE.appex" "$app"; do
            echo "$bundle: $(plutil -extract CFBundleIdentifier raw "$bundle/Info.plist") $(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist") ($(plutil -extract CFBundleVersion raw "$bundle/Info.plist"))"
            codesign -dv "$bundle" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)='
          done
          for bundle in "$app/PlugIns/SimpleX NSE.appex" "$app/PlugIns/SimpleX SE.appex" "$app"; do
            codesign -d --entitlements - --xml "$bundle" > "$RUNNER_TEMP/entitlements.plist"
            plutil -p "$RUNNER_TEMP/entitlements.plist"
            plutil -extract keychain-access-groups.0 raw "$RUNNER_TEMP/entitlements.plist" | grep -qx 5NN7GUYB6T.chat.simplex.app
          done
          du -sh "$archive"

      - name: Pack archive
        run: tar -czf "$RUNNER_TEMP/SimpleX.xcarchive.tar.gz" -C "$RUNNER_TEMP" SimpleX.xcarchive

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ota-ios
          path: ${{ runner.temp }}/SimpleX.xcarchive.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: plan
    if: needs.plan.outputs.run-linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BUILD_CORE: ${{ needs.plan.outputs.linux-core-run == '' }}
      CORE_PKG: desktop-core-linux-x86_64.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      - name: Show runner
        run: |
          lsb_release -ds
          nproc
          free -h
          df -h /

      - name: Setup Haskell
        if: env.BUILD_CORE == 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libgmp-dev libnuma-dev libssl-dev zlib1g-dev patchelf strip-nondeterminism

      - name: Build core library
        if: env.BUILD_CORE == 'true'
        run: scripts/ci/desktop-linux/build-core.sh ~/core/${{ env.CORE_PKG }}

      - name: Upload core library
        if: env.BUILD_CORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.linux-core }}
          path: ~/core/${{ env.CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download core library
        if: env.BUILD_CORE != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.linux-core }}
          path: ~/core
          run-id: ${{ needs.plan.outputs.linux-core-run }}
          github-token: ${{ github.token }}

      - name: Install core library and VLC
        run: |
          scripts/ci/desktop-linux/install-core.sh ~/core/${{ env.CORE_PKG }}
          scripts/desktop/prepare-vlc-linux.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VER }}

      - name: Build AppImage
        env:
          ASSETS_DIR: ../../assets
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          scripts/desktop/make-appimage-linux.sh
          ls -la apps/multiplatform/release/main

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ota-linux
          path: apps/multiplatform/release/main/*.AppImage
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS dmg
    needs: plan
    if: needs.plan.outputs.run-macos == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      BUILD_CORE: ${{ needs.plan.outputs.macos-core-run == '' }}
      CORE_PKG: desktop-core-mac-aarch64.tar.gz
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      - name: Show runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          xcodebuild -version
          ls /Library/Developer/CommandLineTools/SDKs || true

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Setup Haskell
        if: env.BUILD_CORE == 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        if: env.BUILD_CORE == 'true'
        run: brew install openssl@3.0

      - name: Build core library
        if: env.BUILD_CORE == 'true'
        run: scripts/ci/desktop-linux/build-core.sh ~/core/${{ env.CORE_PKG }} mac

      - name: Upload core library
        if: env.BUILD_CORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.macos-core }}
          path: ~/core/${{ env.CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download core library
        if: env.BUILD_CORE != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.macos-core }}
          path: ~/core
          run-id: ${{ needs.plan.outputs.macos-core-run }}
          github-token: ${{ github.token }}

      - name: Install core library and VLC
        run: |
          scripts/ci/desktop-linux/install-core.sh ~/core/${{ env.CORE_PKG }} mac
          scripts/desktop/prepare-vlc-mac.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VER }}

      - name: Build dmg
        working-directory: apps/multiplatform
        run: |
          ./gradlew --no-daemon --console=plain -Psimplex.assets.dir=../../assets packageDmg
          ls -la release/main/dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: ota-macos
          path: apps/multiplatform/release/main/dmg/*.dmg
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows msi
    needs: plan
    if: needs.plan.outputs.run-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      BUILD_CORE: ${{ needs.plan.outputs.windows-core-run == '' }}
      CORE_PKG: desktop-core-windows-x86_64.tar.gz
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      - name: Setup Haskell
        if: env.BUILD_CORE == 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Configure pagefile
        if: env.BUILD_CORE == 'true'
        uses: simplex-chat/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Setup MSYS2
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
            zip
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Build core library
        if: env.BUILD_CORE == 'true'
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          scripts/ci/desktop-linux/build-core.sh "$(cygpath -u "$RUNNER_TEMP")/core/$CORE_PKG" windows

      - name: Upload core library
        if: env.BUILD_CORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.windows-core }}
          path: ${{ runner.temp }}/core/${{ env.CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download core library
        if: env.BUILD_CORE != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.windows-core }}
          path: ${{ runner.temp }}/core
          run-id: ${{ needs.plan.outputs.windows-core-run }}
          github-token: ${{ github.token }}

      - name: Install VLC and core library
        run: |
          scripts/desktop/prepare-vlc-windows.sh
          scripts/ci/desktop-linux/install-core.sh "$(cygpath -u "$RUNNER_TEMP")/core/$CORE_PKG" windows

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VER }}

      - name: Build msi
        working-directory: apps/multiplatform
        run: |
          ./gradlew --no-daemon --console=plain -Psimplex.assets.dir=../../assets packageMsi
          ls -la release/main/msi

      - name: Upload msi
        uses: actions/upload-artifact@v7
        with:
          name: ota-windows
          path: apps/multiplatform/release/main/msi/*.msi
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
