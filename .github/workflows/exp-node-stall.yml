name: exp-node-stall

on:
  push:
    branches:
      - ep/exp-node-stall

jobs:
  stall:
    strategy:
      fail-fast: false
      matrix:
        include:
          - copy: 1
            rts: "-xb0x500000000000"
          - copy: 2
            rts: "-xb0x500000000000"
          - copy: 3
            rts: "-xb0x500000000000"
          - copy: 4
            rts: "-xb0x500000000000"
          - copy: 5
            rts: "-xb0x500000000000"
          - copy: 6
            rts: "-xb0x500000000000"
    runs-on: macos-15-intel
    env:
      SIMPLEX_EXTRA_RTS: ${{ matrix.rts }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/ci/package-tests.sh build macos-x86_64
      - working-directory: packages/simplex-chat-nodejs
        run: node tests/stall.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.copy }}
          path: packages/simplex-chat-nodejs/tests/stall-samples
          if-no-files-found: ignore
