name: desktop-linux

on:
  workflow_dispatch:
    inputs:
      claude:
        type: boolean
        default: false
      backend:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      jobs:
        type: string
        default: verify bench android-size

permissions:
  contents: read
  actions: read

env:
  GHC_VER: 9.6.3
  CABAL_VER: 3.10.2.0
  BASE: ee7eb5987f9a9ac276a22539a292c2eb0696080b

jobs:
  verify:
    name: optimisation levels of the Nix derivations
    if: contains(inputs.jobs, 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify
        run: scripts/ci/mobile-o1/verify.sh "$BASE"

  android-size:
    name: Android core size at -O2 and -O1
    if: contains(inputs.jobs, 'android-size')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and measure
        run: scripts/ci/mobile-o1/verify.sh "$BASE" android-size

  images:
    name: image resizing speed at -O2, -O1 and -O1 with the image module at -O2
    if: contains(inputs.jobs, 'images')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Haskell
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libgmp-dev libnuma-dev libssl-dev zlib1g-dev

      - name: Benchmark
        run: scripts/ci/mobile-o1/bench-image.sh "$RUNNER_TEMP/bench"

  bench:
    name: core speed at -O2 and -O1
    if: contains(inputs.jobs, 'bench')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Haskell
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libgmp-dev libnuma-dev libssl-dev zlib1g-dev

      - name: Benchmark
        run: scripts/ci/mobile-o1/bench.sh "$RUNNER_TEMP/bench"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-o1-bench
          path: ${{ runner.temp }}/bench
          retention-days: 7
          if-no-files-found: warn
