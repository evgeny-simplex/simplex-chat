name: desktop-linux

on:
  workflow_dispatch:
    inputs:
      claude:
        type: boolean
        default: false
      backend:
        type: boolean
        default: false
      release:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GHC_VER: 9.6.3
  CABAL_VER: 3.10.2.0
  BASE: ee7eb5987f9a9ac276a22539a292c2eb0696080b

jobs:
  verify:
    name: optimisation levels of the Nix derivations
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify
        run: scripts/ci/mobile-o1/verify.sh "$BASE"

  bench:
    name: core speed at -O2 and -O1
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Haskell
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libgmp-dev libnuma-dev libssl-dev zlib1g-dev

      - name: Benchmark
        run: scripts/ci/mobile-o1/bench.sh "$RUNNER_TEMP/bench"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-o1-bench
          path: ${{ runner.temp }}/bench
          retention-days: 7
          if-no-files-found: warn
